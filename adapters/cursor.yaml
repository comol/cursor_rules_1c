# Adapter: Cursor
#
# Describes how to copy and adapt files from content/ for Cursor IDE.
# Read by both installation channels (AI-agent installer and install.ps1).
#
# Schema: closed adapter schema described in AGENT-INSTALL.md (Lean placement)
# and implemented by install.ps1.
# Note: Cursor is the only tool that supports glob-based rule activation,
# so "globs" and "alwaysApply" are kept verbatim in the rules frontmatter.

tool: cursor
schemaVersion: 1

detection:
  - exists: ".cursor/"

rules:
  copyTo: ".cursor/rules/{name}.mdc"
  frontmatter:
    keep: [description, globs, alwaysApply]
    drop: [category]

agents:
  copyTo: ".cursor/agents/{name}.md"
  frontmatter:
    # Cursor custom agents have no per-tool field: the documented frontmatter
    # is name / description / model / readonly / is_background, and subagents
    # inherit every parent tool including MCP. So the source `tools` array is
    # not emitted (an undocumented key that a future Cursor could start
    # matching literally would strip shell and MCP the way Claude Code does),
    # and its one enforceable part is expressed through `readonly`, which
    # Cursor defines as "no file edits, no state-changing shell commands" —
    # exactly the agents whose list grants neither Write/Edit nor Shell.
    toolsToFlag:
      source: tools
      target: readonly
      whenNoneOf: [Write, Edit, Shell]
      value: true
    keep: [name, description, readonly, modelHint, allowParallel, isSubagent]
    rename:
      modelHint: model
    drop: [tools, reasoningEffort]

commands:
  copyTo: ".cursor/commands/{name}.md"
  frontmatter:
    keep: [description, argumentHint]
    drop: [allowedTools]

skills:
  copyTo: ".cursor/skills/{name}/"
  mode: verbatim

mcp:
  source: "content/mcp-servers.json"
  target: ".cursor/mcp.json"
  schema: mcpServers
  format: json
